name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: docs-manager/package-lock.json

      - name: Install dependencies
        working-directory: ./docs-manager
        run: npm install

      - name: Sync Supa docs
        run: rsync -av --delete --exclude '.DS_Store' ./Supa/docs/ ./docs-manager/public/supa-docs/

      - name: Build
        working-directory: ./docs-manager
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs-manager/dist
          branch: gh-pages
