name: Build and Deploy MkDocs
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mkdocs-site/requirements.txt
      - name: Sync docs
        run: |
          # If docs are in repo root under docs/, copy them into mkdocs-site/docs/
          rsync -av --delete ./docs/ ./mkdocs-site/docs/ || true
      - name: Build site
        run: |
          mkdocs build --config-file mkdocs-site/mkdocs.yml
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
