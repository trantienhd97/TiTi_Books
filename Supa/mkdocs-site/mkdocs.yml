site_name: Supa Docs
site_description: Documentation for Supa mobile modules
site_author: Supa Team
repo_url: ""
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - toc.integrate
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

plugins:
  - search:
      lang: en
      separator: '[\s\-]+'

markdown_extensions:
  - admonition
  - toc:
      permalink: true

# Nav is auto-discovered from docs/ after sync (README.md → index.md).
# Run: ../scripts/sync_docs_to_mkdocs.sh

extra_css:
  - "stylesheets/extra.css"
