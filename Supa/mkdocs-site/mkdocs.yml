site_name: Supa Docs
site_description: Documentation for Supa mobile modules
site_author: Supa Team
repo_url: ''
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - toc.integrate
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo

plugins:
  - search:
      lang: en
      separator: '[\s\-]+'

markdown_extensions:
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md

extra_css:
  - 'stylesheets/extra.css'
